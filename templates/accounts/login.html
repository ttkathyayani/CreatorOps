{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — CreatorOps SaaS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="{% static 'img/logo.png' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background-color: #111111;
        }
        .auth-box {
            width: 100%;
            max-width: 440px;
            background-color: #1C1C1C;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-md);
            padding: 2.25rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6);
        }
        .demo-roles-grid {
            margin-top: 1.5rem;
            padding-top: 1.25rem;
            border-top: 1px solid var(--border-color);
        }
        .demo-role-btn {
            display: block;
            width: 100%;
            text-align: left;
            padding: 0.55rem 0.75rem;
            margin-bottom: 0.5rem;
            background: #141414;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-sm);
            color: #E5E5E5;
            font-size: 0.8125rem;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .demo-role-btn:hover {
            border-color: #FACC15;
            background: rgba(250, 204, 21, 0.08);
            color: #FACC15;
        }
    </style>
</head>
<body class="auth-wrapper">
    <div class="auth-box">
        <div style="text-align: center; margin-bottom: 1.75rem;">
            <img src="{% static 'img/logo.png' %}" alt="Creator Ops" style="height: 110px; width: auto; object-fit: contain; margin-bottom: 0.5rem; border-radius: 6px;">
            <p style="color: #A3A3A3; font-size: 0.875rem;">Content Planning & Client Approval Cloud SaaS</p>
        </div>

        {% if messages %}
        <div style="margin-bottom: 1.25rem;">
            {% for message in messages %}
            <div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="POST" action="{% url 'accounts:login' %}">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="e.g. admin or creator" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
                Sign In
            </button>
        </form>

        <div style="margin-top: 1rem; text-align: center; font-size: 0.8125rem; color: #A3A3A3;">
            Don't have an agency account? <a href="{% url 'accounts:register' %}" style="color: #FACC15; text-decoration: none; font-weight: 600;">Create one</a>
        </div>

        <!-- Quick 1-Click Demo Logins for Evaluator -->
        <div class="demo-roles-grid">
            <div style="font-size: 0.725rem; font-weight: 700; text-transform: uppercase; color: #737373; margin-bottom: 0.6rem; letter-spacing: 0.05em;">
                ⚡ 1-Click Demo Evaluation Profiles
            </div>
            <button type="button" class="demo-role-btn" onclick="fillCreds('admin', 'admin123')">
                <strong style="color:#FACC15;">Agency Admin:</strong> admin / admin123
            </button>
            <button type="button" class="demo-role-btn" onclick="fillCreds('manager', 'admin123')">
                <strong style="color:#FACC15;">Manager / Reviewer:</strong> manager / admin123
            </button>
            <button type="button" class="demo-role-btn" onclick="fillCreds('creator', 'admin123')">
                <strong style="color:#FACC15;">Content Creator:</strong> creator / admin123
            </button>
            <button type="button" class="demo-role-btn" onclick="fillCreds('client', 'admin123')">
                <strong style="color:#FACC15;">Client Reviewer:</strong> client / admin123
            </button>
        </div>
    </div>

    <script>
        function fillCreds(u, p) {
            document.getElementById('username').value = u;
            document.getElementById('password').value = p;
        }
    </script>
</body>
</html>
