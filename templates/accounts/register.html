{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Workspace — CreatorOps SaaS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="{% static 'img/logo.png' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background-color: #111111;
        }
        .auth-box {
            width: 100%;
            max-width: 480px;
            background-color: #1C1C1C;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-md);
            padding: 2.25rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6);
        }
    </style>
</head>
<body class="auth-wrapper">
    <div class="auth-box">
        <div style="text-align: center; margin-bottom: 1.75rem;">
            <img src="{% static 'img/logo.png' %}" alt="Creator Ops" style="height: 100px; width: auto; object-fit: contain; margin-bottom: 0.5rem; border-radius: 6px;">
            <h1 style="font-size: 1.35rem; font-weight: 700; color: #E5E5E5;">Create Agency Workspace</h1>
            <p style="color: #A3A3A3; font-size: 0.8125rem; margin-top: 0.25rem;">Start collaborating with clients and content creators</p>
        </div>

        {% if messages %}
        <div style="margin-bottom: 1.25rem;">
            {% for message in messages %}
            <div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="POST" action="{% url 'accounts:register' %}">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label" for="agency_name">Agency or Team Name</label>
                <input type="text" id="agency_name" name="agency_name" class="form-control" placeholder="e.g. Apex Creative Studios" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label" for="username">Admin Username</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="e.g. alex_admin" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="email">Work Email</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="alex@apexcreative.io" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
                Create Workspace & Sign In
            </button>
        </form>

        <div style="margin-top: 1.25rem; text-align: center; font-size: 0.8125rem; color: #A3A3A3;">
            Already have an account? <a href="{% url 'accounts:login' %}" style="color: #FACC15; text-decoration: none; font-weight: 600;">Sign in here</a>
        </div>
    </div>
</body>
</html>
