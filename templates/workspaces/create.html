{% extends "base.html" %}

{% block title %}Create Workspace — CreatorOps{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1 class="page-title">Create Agency Workspace</h1>
        <p class="page-subtitle">Isolate client portfolios, campaigns, and team member permissions.</p>
    </div>
</div>

<div class="card" style="max-width: 600px;">
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label class="form-label" for="name">Workspace Name *</label>
            <input type="text" id="name" name="name" class="form-control" placeholder="e.g. Apex Digital Global" required autofocus>
        </div>

        <div class="form-group">
            <label class="form-label" for="description">Workspace Description</label>
            <textarea id="description" name="description" class="form-control" rows="3" placeholder="Agency branch, team scope or department..."></textarea>
        </div>

        <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
            <button type="submit" class="btn btn-primary">Create Workspace</button>
            <a href="{% url 'dashboard' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
